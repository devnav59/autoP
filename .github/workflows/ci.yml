name: Android checks

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare downloadable APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p debug-release
          cp app/build/outputs/apk/debug/app-debug.apk \
            "debug-release/autoP-debug-${GITHUB_SHA::7}.apk"

      - name: Upload debug APK
        id: upload_debug
        uses: actions/upload-artifact@v4
        with:
          name: autoP-debug-${{ github.run_number }}
          path: debug-release/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Show APK download link in run summary
        if: ${{ always() && steps.upload_debug.outcome == 'success' }}
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.upload_debug.outputs.artifact-url }}
        run: |
          {
            echo "## 📱 دانلود APK آزمایشی autoP"
            echo
            echo "### [⬇️ دانلود فایل APK]($ARTIFACT_URL)"
            echo
            echo "این خروجی Debug است و تا ۱۴ روز در GitHub Actions نگه‌داری می‌شود."
          } >> "$GITHUB_STEP_SUMMARY"
