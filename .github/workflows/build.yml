name: Build signed Android release

on:
  # The push trigger makes this workflow visible and runnable even before the branch is merged
  # into the default branch. workflow_dispatch itself is only exposed by GitHub from default.
  push:
    branches:
      - main
      - "arena/**"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (for example 1.2.0)"
        required: true
        default: "1.0.0"
        type: string
      version_code:
        description: "Positive integer Android version code"
        required: true
        default: "1"
        type: string
      create_github_release:
        description: "Also create a GitHub Release and attach the files"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  VERSION_NAME: ${{ inputs.version_name || format('1.0.{0}', github.run_number) }}
  VERSION_CODE: ${{ inputs.version_code || github.run_number }}

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION_NAME" =~ ^[0-9]+([.][0-9A-Za-z_-]+)*$ ]] || {
            echo "Invalid version_name: $VERSION_NAME" >&2
            exit 1
          }
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || {
            echo "version_code must be a positive integer" >&2
            exit 1
          }

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore signing keystore
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in SIGNING_KEY_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!value}" ]]; then
              echo "Required signing secret is missing: $value" >&2
              exit 1
            fi
          done
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/autop-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/autop-release.jks" \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/autop-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace \
            -PVERSION_NAME="$VERSION_NAME" \
            -PVERSION_CODE="$VERSION_CODE" \
            :app:clean :app:assembleRelease :app:bundleRelease

      - name: Verify signatures and prepare files
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p release-files
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" \
            | tee release-files/signature-fingerprints.txt
          # Android signing certificates are commonly self-signed, so -strict would reject an
          # otherwise valid release solely because there is no public CA chain.
          jarsigner -verify -certs "$AAB" | tee release-files/aab-signature-verification.txt
          jarsigner -verify "$AAB" | grep -q "jar verified"
          keytool -exportcert -rfc \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -file release-files/signing-certificate.pem
          cp "$APK" "release-files/autoP-v$VERSION_NAME.apk"
          cp "$AAB" "release-files/autoP-v$VERSION_NAME.aab"
          (cd release-files && sha256sum *.apk *.aab *.pem > SHA256SUMS.txt)

      - name: Upload release artifacts
        id: upload_release
        uses: actions/upload-artifact@v6
        with:
          name: autoP-v${{ env.VERSION_NAME }}-signed
          path: release-files/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Create GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_github_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: autoP v${{ env.VERSION_NAME }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-files/*

      - name: Show download link in run summary
        if: ${{ always() && steps.upload_release.outcome == 'success' }}
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.upload_release.outputs.artifact-url }}
          CREATE_RELEASE: ${{ inputs.create_github_release }}
        run: |
          {
            echo "## 📦 دانلود خروجی autoP"
            echo
            echo "### [⬇️ دانلود APK و AAB امضاشده]($ARTIFACT_URL)"
            echo
            echo "فایل دانلودی شامل APK، AAB، گواهی عمومی امضا و SHA256 است."
            echo
            echo "- نسخه: \`$VERSION_NAME\`"
            echo "- اعتبار لینک Artifact: ۳۰ روز"
            echo "- [مشاهده جزئیات همین اجرا]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            if [[ "$CREATE_RELEASE" == "true" ]]; then
              echo "- [صفحه GitHub Release و دانلود مستقیم فایل‌ها]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$VERSION_NAME)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
